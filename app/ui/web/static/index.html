<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' http://127.0.0.1:*; img-src 'self' http://127.0.0.1:* data: blob:;
               style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';
               connect-src 'self' http://127.0.0.1:*">
<title>PDF Image Editor</title>

<!-- 首帧之前定外观，否则深色模式下会先白一下 -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('appTheme'); } catch (e) {}
    if (saved !== 'dark' && saved !== 'light') {
      saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = saved;
  })();
</script>

<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/app.css">
</head>

<body>
<div class="app" id="app">

  <header class="topbar">
    <button class="btn" data-act="open" data-i18n="toolbar.open">打开</button>
    <button class="btn primary" data-act="save" data-i18n="toolbar.save" disabled>保存</button>
    <button class="btn ghost" data-act="save-as" data-i18n="toolbar.save_as" disabled>另存为</button>

    <div class="doc-name" id="docName" hidden>
      <span id="docTitle"></span>
      <i class="dirty-dot hidden" id="dirtyDot"></i>
    </div>

    <span class="topbar-sep"></span>

    <button class="btn ghost" data-act="undo" data-i18n="toolbar.undo" disabled>撤销</button>
    <button class="btn ghost" data-act="redo" data-i18n="toolbar.redo" disabled>重做</button>

    <span class="topbar-sep"></span>

    <div class="zoom-box">
      <button class="btn ghost" data-act="zoom-out" data-i18n-title="toolbar.zoom_out"
              aria-label="zoom out">−</button>
      <button class="zoom-value" id="zoomValue" data-act="zoom-reset"
              data-i18n-title="toolbar.zoom_reset">100%</button>
      <button class="btn ghost" data-act="zoom-in" data-i18n-title="toolbar.zoom_in"
              aria-label="zoom in">+</button>
      <button class="btn sm" data-act="fit-width" data-i18n="toolbar.fit_width">适合宽度</button>
    </div>

    <span class="spacer"></span>

    <div class="busy hidden" id="busy">
      <span id="busyText"></span>
      <div class="busy-bar"><i id="busyBar"></i></div>
    </div>

    <button class="btn ghost" data-act="export" data-i18n="toolbar.export" disabled>导出页</button>
    <button class="btn ghost" data-act="settings" data-i18n="toolbar.settings">设置</button>

    <div class="seg compact" id="themeSeg" role="group" data-i18n-aria="theme.label">
      <button class="seg-item" data-theme-value="light" data-i18n="theme.light">浅色</button>
      <button class="seg-item" data-theme-value="dark" data-i18n="theme.dark">深色</button>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="empty" id="empty">
      <h2 data-i18n="empty.title">还没有打开文件</h2>
      <p data-i18n="empty.hint">打开一个 PDF，就能开始切分和替换里面的图片。</p>
      <button class="btn primary" data-act="open" data-i18n="empty.open">打开 PDF</button>
    </div>
    <div class="pages" id="pages" hidden></div>
  </main>

  <aside class="inspector" id="inspector">
    <h2 data-i18n="inspector.title">属性</h2>
    <div id="inspectorBody"></div>
  </aside>

</div>

<div class="split-bar hidden" id="splitBar">
  <span class="split-hint" id="splitHint"></span>
  <button class="btn sm" id="splitKeep" data-act="keep-cell" data-i18n="split.keep"
          disabled>仅保留此格</button>
  <button class="btn sm" id="splitPunch" data-act="punch-cell" data-i18n="split.extract"
          disabled>提取此格</button>
  <button class="btn sm" id="splitAll" data-act="split-all" data-i18n="split.all"
          disabled>按格切分</button>
  <button class="btn sm ghost" data-act="split-cancel" data-i18n="dialog.cancel">取消</button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
