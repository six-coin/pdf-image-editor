<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' http://127.0.0.1:*; img-src 'self' http://127.0.0.1:* data: blob:;
               style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';
               connect-src 'self' http://127.0.0.1:*">
<title>PDF Image Editor</title>

<!-- 首帧之前定外观，否则深色模式下会先白一下 -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('appTheme'); } catch (e) {}
    if (saved !== 'dark' && saved !== 'light') {
      saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = saved;
  })();
</script>

<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/app.css">
</head>

<body>
<!-- 属性栏默认收起：等第一份快照到了再按 show_inspector 决定，避免开屏闪一下 -->
<div class="app inspector-hidden" id="app">

  <header class="topbar" role="toolbar" data-i18n-aria="app.title">
    <button class="btn" data-act="open" data-i18n="toolbar.open">打开</button>
    <button class="btn ghost" data-act="save" data-i18n="toolbar.save" disabled>保存</button>
    <button class="btn ghost" data-act="save-as" data-i18n="toolbar.save_as" disabled>另存为</button>

    <div class="doc-name" id="docName" hidden>
      <span id="docTitle"></span>
      <i class="dirty-dot hidden" id="dirtyDot" aria-hidden="true"></i>
    </div>

    <span class="topbar-sep" aria-hidden="true"></span>

    <button class="icon-btn" data-act="undo" title="撤销" data-i18n-title="toolbar.undo"
            data-i18n-aria="toolbar.undo" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4.6 8.4h7.2a4.2 4.2 0 0 1 0 8.4H8.2"></path>
        <path d="M7.7 4.5 3.8 8.4l3.9 3.9"></path>
      </svg>
    </button>
    <button class="icon-btn" data-act="redo" title="重做" data-i18n-title="toolbar.redo"
            data-i18n-aria="toolbar.redo" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M15.4 8.4H8.2a4.2 4.2 0 0 0 0 8.4h3.6"></path>
        <path d="M12.3 4.5l3.9 3.9-3.9 3.9"></path>
      </svg>
    </button>

    <span class="topbar-sep" aria-hidden="true"></span>

    <div class="zoom-box" role="group" data-i18n-aria="toolbar.zoom">
      <button class="btn ghost" data-act="zoom-out" data-i18n-aria="toolbar.zoom_out"
              aria-label="zoom out">−</button>
      <input class="zoom-input" id="zoomValue" type="text" inputmode="numeric" value="100%"
             data-i18n-aria="toolbar.zoom_input" aria-label="zoom level">
      <button class="btn ghost" data-act="zoom-in" data-i18n-aria="toolbar.zoom_in"
              aria-label="zoom in">+</button>
      <button class="btn sm" data-act="fit-width" data-i18n="toolbar.fit_width">适合宽度</button>
      <button class="btn sm" data-act="zoom-reset" data-i18n="toolbar.zoom_reset">100%</button>
    </div>

    <span class="spacer"></span>

    <div class="busy hidden" id="busy" role="status" aria-live="polite">
      <span id="busyText"></span>
      <div class="busy-bar"><i id="busyBar"></i></div>
    </div>

    <button class="btn ghost" data-act="preprocess" data-i18n="toolbar.preprocess">预处理</button>
    <button class="btn ghost" data-act="export" data-i18n="toolbar.export" disabled>导出页</button>
    <button class="icon-btn" id="btnReload" data-act="reload" title="重新加载"
            data-i18n-title="toolbar.reload" data-i18n-aria="toolbar.reload" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M16.4 10a6.4 6.4 0 1 1-1.9-4.5"></path>
        <path d="M16.5 3.5v4h-4"></path>
      </svg>
    </button>

    <button class="icon-btn" id="btnTheme" data-act="toggle-theme" title="切换深浅色"
            data-i18n-title="theme.toggle" data-i18n-aria="theme.toggle">
      <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M13.4 9.8A5.8 5.8 0 0 1 6.2 2.6a5.8 5.8 0 1 0 7.2 7.2z"></path>
      </svg>
      <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1"></circle>
        <path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"></path>
      </svg>
    </button>

    <button class="icon-btn" id="btnSettings" data-act="settings" title="设置"
            data-i18n-title="toolbar.settings" data-i18n-aria="toolbar.settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>

    <button class="icon-btn" id="btnInspector" data-act="toggle-inspector" title="显示或隐藏属性栏"
            data-i18n-title="inspector.toggle" data-i18n-aria="inspector.toggle"
            aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6"></rect>
        <path d="M10.1 2.6v10.8"></path>
      </svg>
    </button>
  </header>

  <main class="viewport" id="viewport" role="region" data-i18n-aria="app.title">
    <div class="empty" id="empty">
      <h2 data-i18n="empty.title">还没有打开文件</h2>
      <p data-i18n="empty.hint">打开一个 PDF，就能开始切分和替换里面的图片。</p>
      <button class="btn primary" data-act="open" data-i18n="empty.open">打开 PDF</button>
    </div>
    <div class="pages" id="pages" hidden></div>
    <div class="page-chip hidden" id="pageChip" role="status" aria-live="polite"></div>
  </main>

  <aside class="inspector" id="inspector" role="complementary" data-i18n-aria="inspector.title">
    <h2 data-i18n="inspector.title">属性</h2>
    <div class="inspector-body" id="inspectorBody"></div>
    <div class="inspector-footer">
      <span class="inspector-page" id="inspectorPage"></span>
      <div class="page-jump">
        <input class="page-input" id="pageJump" type="number" min="1" step="1"
               data-i18n-aria="page.jump" data-i18n-placeholder="page.jump_hint"
               aria-label="page number">
        <button class="btn sm" data-act="page-jump" data-i18n="page.jump_go">跳转</button>
      </div>
    </div>
  </aside>

</div>

<div class="split-bar hidden" id="splitBar">
  <span class="split-hint" id="splitHint"></span>
  <button class="btn sm" id="splitKeep" data-act="keep-cell" disabled>
    <span data-i18n="split.keep">仅保留此格</span><kbd></kbd>
  </button>
  <button class="btn sm" id="splitPunch" data-act="punch-cell" disabled>
    <span data-i18n="split.extract">提取此格</span><kbd></kbd>
  </button>
  <button class="btn sm" id="splitAll" data-act="split-all" disabled>
    <span data-i18n="split.all">按格切分</span><kbd></kbd>
  </button>
  <button class="btn sm ghost" data-act="split-cancel">
    <span data-i18n="dialog.cancel">取消</span><kbd></kbd>
  </button>
</div>

<div class="save-banner hidden" id="saveBanner" role="status" aria-live="assertive">
  <i class="spinner" aria-hidden="true"></i>
  <span data-i18n="status.saving">正在保存，暂时不要修改文档</span>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
