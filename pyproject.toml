[project]
name = "pdf-image-editor"
version = "1.0.0"
description = "在 PDF 里切分、移动、替换图片，保留原有文字层。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "pymupdf>=1.24,<2",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["old", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
